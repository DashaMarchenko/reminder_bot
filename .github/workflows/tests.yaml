
name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx==0.24.1

      - name: Create test configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path("config/config.ini")
          config.parent.mkdir(parents=True, exist_ok=True)

          config.write_text(
              "[BOT_CONFIG]\n"
              "BOT_TOKEN = 123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi\n"
              "HOST_URL = https://example.com\n"
              "ADMIN_ID = 123456789\n",
              encoding="utf-8"
          )
          PY

      - name: Check Python syntax
        run: |
          python -m compileall -q app calendars config database handlers
          python -m compileall -q run_polling.py schedule.py bot_config.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
